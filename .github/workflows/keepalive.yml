name: Keep awake

on:
  schedule:
    # Render free services sleep after 15 minutes without traffic.
    - cron: "*/10 * * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping /health
        env:
          APP_URL: ${{ vars.APP_URL }}
        run: |
          if [ -z "$APP_URL" ]; then
            echo "APP_URL variable is not set; skipping."
            exit 0
          fi
          curl -fsS --retry 6 --retry-delay 20 --retry-all-errors "${APP_URL%/}/health"
